<div class="wrapper">
    <form nz-form
          [formGroup]="form()"
          [class.horizontal-wrapper]="!isVertical()"
    >
        <app-text-field [label]="Sftoomi.Translator.translate('last_name')"
                       [name]="lastName()"
                       [form]="form()"
                       [useUppercase]="true"
        />

        <app-text-field [label]="Sftoomi.Translator.translate('first_name')"
                       [name]="firstName()"
                       [form]="form()"
                       [useUppercase]="true"
        />

        <app-text-field [label]="Sftoomi.Translator.translate('middle_name')"
                       [name]="middleName()"
                       [form]="form()"
                       [useUppercase]="true"
        />

        <app-datepicker [label]="Sftoomi.Translator.translate('dob_full')"
                        [name]="dobName()"
                        [form]="form()"
        />

        <app-gender-combo [name]="genderName()"
                          [form]="form()"
        />

        <app-phone-field [label]="Sftoomi.Translator.translate('phone')"
                   [name]="phoneName()"
                   [form]="form()"
        />
    </form>
</div>
