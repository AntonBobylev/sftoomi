<nz-form-item [formGroup]="form()">
    @if (!Sftoomi.isEmpty(label())) {
        <nz-form-label [nzRequired]="Sftoomi.isFieldRequired(form(), name())"
                       [nzFor]="name()"
        >
            {{ label() }}
        </nz-form-label>
    }

    <nz-form-control [nzErrorTip]="errorTipTpl">
        @if (securedInput()) {
            <nz-input-password nzAllowClear>
                <input nz-input
                       [formControlName]="name()"
                       (input)="onInput($event)"
                       [id]="name()"
                       [attr.placeholder]="placeholder()"
                />
            </nz-input-password>
        } @else {
            <nz-input-wrapper nzAllowClear>
                <input nz-input
                       [formControlName]="name()"
                       (input)="onInput($event)"
                       [id]="name()"
                       [maskito]="mask()"
                       [attr.placeholder]="placeholder()"
                />
            </nz-input-wrapper>
        }

        <ng-template #errorTipTpl>
            <form-field-error-template [fieldName]="name()"
                                       [fieldForm]="form()"
            />
        </ng-template>
    </nz-form-control>
</nz-form-item>
