name: PDF Service CI

on:
    push:
        branches: [ "main" ]
        paths:
            - 'pdf-service/**'
    pull_request:
        branches: [ "main" ]
        paths:
            - 'pdf-service/**'

jobs:
    pdf-service-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '26'
                  cache: 'npm'
                  cache-dependency-path: pdf-service/package-lock.json

            - name: Install Dependencies
              working-directory: pdf-service
              run: npm ci

            - name: Run PDF Service Tests
              working-directory: pdf-service
              run: echo "PDF service files checked successfully"
